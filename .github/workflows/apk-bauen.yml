# Baut automatisch die APK, sobald Code auf GitHub hochgeladen wird
# (oder per Knopf "Run workflow" im Reiter "Actions").
name: APK bauen

on:
  push:
  workflow_dispatch:

# Erlaubt dem Bauauftrag, das Release "Neueste Version" anzulegen
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Zeitwaechter-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Legt die APK als Release "Neueste Version" ab – direkt vom Handy herunterladbar:
      # https://github.com/<dein-name>/zeitwaechter/releases/latest
      - name: Als Release "Neueste Version" veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName = '\K[^']+" app/build.gradle)
          FILE="Zeitwaechter-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste "$FILE" \
            --target "${GITHUB_SHA}" \
            --title "Zeitwächter ${VERSION}" \
            --notes "Version ${VERSION}, automatisch gebaut aus Commit ${GITHUB_SHA::7}. Auf dem Handy ${FILE} antippen und über die installierte Version drüber installieren." \
            --latest
