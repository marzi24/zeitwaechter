# Baut automatisch die APK, sobald Code auf GitHub hochgeladen wird
# (oder per Knopf "Run workflow" im Reiter "Actions").
name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Zeitwaechter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
