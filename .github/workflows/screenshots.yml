# Startet einen Android-Emulator, installiert die App mit Beispieldaten und macht Screenshots.
# Wird nur von Hand gestartet (Reiter "Actions" → "Screenshots" → "Run workflow")
# oder durch einen Push auf den Zweig "screenshots".
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [screenshots]

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: KVM aktivieren (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator starten und Screenshots machen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/screens.sh

      - name: Screenshots als Release "screenshots" ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots screens/*.png --target "${GITHUB_SHA}" \
            --title "Screenshots" --notes "Automatisch erstellt aus Commit ${GITHUB_SHA::7}" --prerelease
