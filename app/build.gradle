plugins {
    id 'com.android.application'
}

android {
    namespace = 'de.marcel.zeitwaechter'
    compileSdk = 35

    defaultConfig {
        applicationId = 'de.marcel.zeitwaechter'
        minSdk = 26
        targetSdk = 35
        versionCode = 3
        versionName = '1.1.1'
    }

    // Fester Schlüssel: Jeder Bau wird gleich unterschrieben, damit Updates
    // über die installierte Version drüber installiert werden können.
    signingConfigs {
        fest {
            storeFile = file('zeitwaechter.keystore')
            storePassword = 'zeitwaechter'
            keyAlias = 'zeitwaechter'
            keyPassword = 'zeitwaechter'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.fest
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    // Google-Standortdienste: Geofencing (Ankommen/Verlassen erkennen)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
